<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Governance Delivery Dashboard - Operational Overview</title>
  <desc id="desc">Operational dashboard mockup based on 53 synthetic delivery work items as of July 1, 2025. It shows open work, active workload, assignment coverage, ageing, cycle time, workload by assignee, item composition, and critical items.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #DCE6EF; }
      .page-title { font-size: 22px; font-weight: 700; fill: #17212B; }
      .section-title { font-size: 16px; font-weight: 700; fill: #17212B; }
      .label { font-size: 11px; font-weight: 700; fill: #667085; letter-spacing: 0.2px; }
      .value { font-size: 31px; font-weight: 750; fill: #17212B; }
      .small { font-size: 10.5px; font-weight: 500; fill: #667085; }
      .body { font-size: 11.5px; font-weight: 500; fill: #344054; }
      .axis { font-size: 10px; font-weight: 500; fill: #667085; }
      .nav { font-size: 12px; font-weight: 650; fill: #DCE6EF; }
      .nav-active { font-size: 12px; font-weight: 700; fill: #17324D; }
      .table-head { font-size: 10px; font-weight: 750; fill: #667085; letter-spacing: 0.3px; }
      .table-text { font-size: 10.5px; font-weight: 550; fill: #344054; }
    </style>
  </defs>

