<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Governance Delivery Dashboard - Backlog</title>
  <desc id="desc">Backlog dashboard mockup based on synthetic delivery data as of July 1, 2025. It shows neutral filters, portfolio counts, and eight high-priority open work items.</desc>
