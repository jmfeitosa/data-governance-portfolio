    <circle cx="687" cy="751" r="9" fill="#FEE4E2"/>
    <text x="687" y="755" text-anchor="middle" font-size="11" font-weight="800" fill="#B42318">1</text>
    <text x="708" y="755" class="insight">Prioritize the 33 open items that meet at least one risk condition.</text>

    <circle cx="687" cy="787" r="9" fill="#FFF8E8"/>
    <text x="687" y="791" text-anchor="middle" font-size="11" font-weight="800" fill="#B26A00">2</text>
    <text x="708" y="791" class="insight">Review Access and Privacy and Master Data and Lifecycle: 0% closed.</text>

    <circle cx="687" cy="823" r="9" fill="#ECFDF3"/>
    <text x="687" y="827" text-anchor="middle" font-size="11" font-weight="800" fill="#2E7D32">3</text>
    <text x="708" y="827" class="insight">Two workstreams lead at 55% completion.</text>

    <rect x="1240" y="742" width="150" height="86" rx="8" fill="#F0F9FF"/>
    <text x="1315" y="768" text-anchor="middle" class="label">UNASSIGNED OPEN</text>
    <text x="1315" y="803" text-anchor="middle" font-size="27" font-weight="750" fill="#1D4ED8">0</text>
    <text x="1315" y="819" text-anchor="middle" class="small">ownership coverage</text>
  </g>

  <text x="24" y="888" class="small">Synthetic portfolio data • Metric definitions documented in metric-dictionary.md • No internal or personal data</text>
  <text x="1416" y="888" text-anchor="end" class="small">Executive Overview • Public mockup</text>
</svg>
