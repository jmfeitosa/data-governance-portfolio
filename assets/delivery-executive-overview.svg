    <rect x="1350" y="517" width="44" height="22" rx="11" fill="#FEE4E2"/>
    <text x="1372" y="532" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B42318">8 risk</text>

    <text x="676" y="579" class="body">Master Data and Lifecycle</text>
    <rect x="900" y="566" width="390" height="16" rx="8" fill="#E9EEF4"/>
    <rect x="900" y="566" width="3" height="16" rx="2" fill="#B42318"/>
    <text x="1310" y="579" class="body">0%</text>
    <rect x="1350" y="563" width="44" height="22" rx="11" fill="#FEE4E2"/>
    <text x="1372" y="578" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B42318">9 risk</text>

    <line x1="900" y1="605" x2="1290" y2="605" stroke="#D0D5DD"/>
    <text x="900" y="624" class="small">0%</text>
    <text x="1087" y="624" class="small">50%</text>
    <text x="1268" y="624" class="small">100%</text>
  </g>

  <g>
    <rect x="24" y="662" width="606" height="202" rx="10" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="46" y="695" class="section-title">Risk signals</text>
    <text x="46" y="716" class="small">Conditions can overlap; At Risk counts each item once</text>

    <rect x="46" y="741" width="129" height="89" rx="8" fill="#FFF4F2"/>
    <text x="60" y="765" class="label">AT RISK</text>
    <text x="60" y="802" font-size="27" font-weight="750" fill="#B42318">33</text>
    <text x="60" y="820" class="small">of 36 open</text>

    <rect x="187" y="741" width="129" height="89" rx="8" fill="#FFF8E8"/>
    <text x="201" y="765" class="label">OVERDUE</text>
    <text x="201" y="802" font-size="27" font-weight="750" fill="#B26A00">31</text>
    <text x="201" y="820" class="small">past due date</text>

    <rect x="328" y="741" width="129" height="89" rx="8" fill="#EEF4FF"/>
    <text x="342" y="765" class="label">STALE</text>
    <text x="342" y="802" font-size="27" font-weight="750" fill="#1D4ED8">19</text>
    <text x="342" y="820" class="small">&gt;14 days</text>

    <rect x="469" y="741" width="139" height="89" rx="8" fill="#F4F0FA"/>
    <text x="483" y="765" class="label">BLOCKED</text>
    <text x="483" y="802" font-size="27" font-weight="750" fill="#6D4C9F">6</text>
    <text x="483" y="820" class="small">explicit or on hold</text>
