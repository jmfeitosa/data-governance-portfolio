    <text x="1372" y="440" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B42318">5 risk</text>

    <text x="676" y="487" class="body">Data Quality</text>
    <rect x="900" y="474" width="390" height="16" rx="8" fill="#E9EEF4"/>
    <rect x="900" y="474" width="176" height="16" rx="8" fill="#2E7D32"/>
    <text x="1310" y="487" class="body">45%</text>
    <rect x="1350" y="471" width="44" height="22" rx="11" fill="#FEE4E2"/>
    <text x="1372" y="486" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B42318">6 risk</text>

