    <text x="64" y="483" class="legend">Closed 32%</text>
    <circle cx="170" cy="479" r="5" fill="#1D4ED8"/>
    <text x="182" y="483" class="legend">Active 30%</text>
    <circle cx="279" cy="479" r="5" fill="#667085"/>
    <text x="291" y="483" class="legend">New 19%</text>
    <circle cx="376" cy="479" r="5" fill="#B26A00"/>
    <text x="388" y="483" class="legend">Validation 9%</text>
    <circle cx="497" cy="479" r="5" fill="#6D4C9F"/>
    <text x="509" y="483" class="legend">On hold 9%</text>

    <line x1="46" y1="518" x2="608" y2="518" stroke="#E4E7EC"/>
    <text x="46" y="547" class="label">EXECUTIVE INTERPRETATION</text>
    <text x="46" y="573" class="body">68% of the current delivery scope remains open.</text>
    <text x="46" y="596" class="body">Validation and paused work represent 19% of all delivery items.</text>
    <rect x="46" y="609" width="195" height="19" rx="9.5" fill="#ECFDF3"/>
    <text x="143.5" y="622" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2E7D32">Status reconciliation: passed</text>
  </g>

  <g>
    <rect x="654" y="306" width="762" height="332" rx="10" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="676" y="338" class="section-title">Completion by workstream</text>
    <text x="676" y="359" class="small">Closed delivery items divided by total delivery items</text>

    <text x="676" y="395" class="body">Governance Foundation</text>
    <rect x="900" y="382" width="390" height="16" rx="8" fill="#E9EEF4"/>
