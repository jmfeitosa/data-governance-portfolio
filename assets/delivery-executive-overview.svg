<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Data Governance Delivery Dashboard - Executive Overview</title>
  <desc id="desc">Executive dashboard mockup based on 53 synthetic delivery work items as of July 1, 2025. It shows completion, status composition, workstream progress, and risk signals.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17324D" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #DCE6EF; }
      .page-title { font-size: 22px; font-weight: 700; fill: #17212B; }
      .section-title { font-size: 16px; font-weight: 700; fill: #17212B; }
      .label { font-size: 12px; font-weight: 600; fill: #667085; letter-spacing: 0.2px; }
      .value { font-size: 31px; font-weight: 750; fill: #17212B; }
      .small { font-size: 11px; font-weight: 500; fill: #667085; }
      .body { font-size: 12px; font-weight: 500; fill: #344054; }
      .legend { font-size: 11px; font-weight: 600; fill: #475467; }
      .nav { font-size: 12px; font-weight: 650; fill: #DCE6EF; }
      .nav-active { font-size: 12px; font-weight: 700; fill: #17324D; }
      .insight { font-size: 13px; font-weight: 600; fill: #344054; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#F5F7FA"/>

  <rect x="0" y="0" width="1440" height="88" fill="#17324D"/>
  <circle cx="42" cy="44" r="21" fill="#2CA58D"/>
  <path d="M32 45 L40 53 L54 35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="78" y="38" class="title">Data Governance Delivery</text>
  <text x="78" y="61" class="subtitle">Executive monitoring • Synthetic portfolio demonstration</text>

  <rect x="925" y="26" width="112" height="36" rx="18" fill="#FFFFFF"/>
  <text x="981" y="49" text-anchor="middle" class="nav-active">Executive</text>
  <text x="1071" y="49" text-anchor="middle" class="nav">Operational</text>
  <text x="1168" y="49" text-anchor="middle" class="nav">Backlog</text>
  <text x="1260" y="49" text-anchor="middle" class="nav">Risks</text>
  <rect x="1315" y="23" width="101" height="42" rx="8" fill="#244761"/>
  <text x="1365.5" y="49" text-anchor="middle" class="nav">Reset filters</text>

  <text x="24" y="126" class="page-title">Executive Overview</text>
  <text x="24" y="148" class="small">Portfolio delivery, status and risk signals</text>
  <rect x="1119" y="109" width="297" height="46" rx="8" fill="#E9EEF4"/>
  <text x="1137" y="128" class="small">REPORTING CONTEXT</text>
  <text x="1137" y="146" class="body">All workstreams  •  As of 1 Jul 2025</text>

  <g>
    <rect x="24" y="174" width="214" height="108" rx="9" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="24" y="174" width="5" height="108" rx="3" fill="#17324D"/>
    <text x="44" y="203" class="label">DELIVERY SCOPE</text>
    <text x="44" y="247" class="value">53</text>
    <text x="44" y="267" class="small">Executable work items</text>
  </g>

