    <text x="46" y="359" class="small">53 delivery items • Mutually exclusive normalized states</text>

    <rect x="46" y="390" width="562" height="50" rx="7" fill="#E9EEF4"/>
    <path d="M53 390 H226 V440 H53 Q46 440 46 433 V397 Q46 390 53 390 Z" fill="#2E7D32"/>
    <rect x="226" y="390" width="170" height="50" fill="#1D4ED8"/>
    <rect x="396" y="390" width="106" height="50" fill="#667085"/>
