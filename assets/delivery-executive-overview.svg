    <text x="136" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">17 closed</text>
    <text x="311" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">16 active</text>
    <text x="449" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">10 new</text>
    <text x="528" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
    <text x="581" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>

