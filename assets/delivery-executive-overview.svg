    <text x="1194" y="247" class="value">33</text>
    <rect x="1282" y="218" width="111" height="29" rx="14.5" fill="#FEE4E2"/>
    <text x="1337.5" y="237" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-size="12" font-weight="700" fill="#B42318">92% of open</text>
    <text x="1194" y="267" class="small">Blocked, overdue or stale</text>
